name: parallel
on: workflow_dispatch
jobs:
  first_job:
    runs-on: ubuntu-latest
    steps:
      - name: Print greeting
        run: echo "Hello world"
      - name: Print good bye
        run: echo "Bye"
  second_job:
    runs-on: ubuntu-latest
    steps:
      - name: Print greeting 2
        run: echo "Hello world2"
      - name: Print good bye 2
        run: echo "Bye2"
  third_job:
    needs: [first_job, second_job]
    runs-on: ubuntu-latest
    steps:
      - name: Print greeting 3
        run: echo "Hello world3"
      - name: Print good bye 3
        run: echo "Bye3"
